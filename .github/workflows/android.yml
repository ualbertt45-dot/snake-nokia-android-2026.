
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do jogo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cython==0.29.34' buildozer

      - name: Gerar aplicativo Android
        run: buildozer -v android debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Nokia-Android-APK
          path: bin/*.apk
          if-no-files-found: error
